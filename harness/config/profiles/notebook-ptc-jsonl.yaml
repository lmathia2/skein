# Standard profile: notebook-native PTC with the dependency-free canonical JSONL ledger.
# Safe optimizer-owned fields are discoverable with `skein tuning-export`.
# Safety, authority, topology, verification, persistence, and redaction stay fixed.
schema_version: 1  # Composition schema, not an experiment parameter.

app:
  name: skein  # Stable ADK application identity.

harness:
  implementation: skein_v1  # Closed factory key; topology is code-owned.
  api_version: 1
  required_capabilities:  # Client/runtime compatibility contract.
    - streaming
    - steering
    - tool_events
    - state_snapshots
    - artifacts
  config:
    models:
      coding:
        provider: google_adk  # Built-in provider registry key.
        name: gemini-3.7-flash  # Tunable model identity.
        retry:  # Transport reliability, not model reasoning behavior.
          attempts: 3
          exponential_base: 2
          initial_delay_seconds: 1
          retry_statuses: [429, 500, 502, 503, 504]
    agents:
      coding_worker:
        model: coding  # References the sole model entry above.
        generation:  # Null preserves provider defaults; all three fields are tunable.
          temperature: null
          top_p: null
          max_output_tokens: null
        instruction: |  # Primary learnable, cache-stable behavior prompt.
            You are an expert coding assistant. Answer conversation and explanation requests directly.
            Use repository tools only when the request needs them. For code changes, inspect relevant
            code, make the smallest coherent change, and let the outer workflow verify it.

            Prefer targeted read ranges, bounded search, bash for builds and tests, edit for exact
            replacements, and write for complete files. For `.ipynb` files, use `nb read` or
            `nb search` through bash; never parse notebook JSON directly. Keep output concise.

            Own the complete model/tool loop for this task; do not stop merely to report progress.
            When finished, return the AgentStep schema. Use answer only for read-only conversation,
            verify or done after code changes, and blocked only when human input is required. Return
            every schema field, using empty arrays or null when a field is not useful. Each completion
            claim contains criterion and an evidence array. The outer workflow decides whether
            verification succeeds.
    workflow:
      max_iterations: 40  # Maximum model work batches per task.
      progress:
        replan_after_no_progress: 2  # Repeated stagnant batches before replanning.
        block_after_no_progress: 4  # Must exceed the replan threshold.
        action_history_limit: 40  # Fingerprints retained for repeat detection.

    tools:  # Nested PTC capabilities reuse these limits and the normal effect broker.
      read_default_lines: 400
      bash_default_timeout_seconds: 120
      bash_max_timeout_seconds: 600
      output:
        max_bytes: 16000
      search:
        backend: auto
        default_page_size: 20
        max_page_size: 50

    notebook_ptc:
      enabled: true  # Replace four top-level tools with one persistent execute_code tool.
      implementation: skein_notebook  # Compared independently with adk_code_mode.
      default_timeout_seconds: 120  # Default cell execution timeout.
      max_timeout_seconds: 600
      max_output_bytes: 16000  # Inline cell output; oversized MIME becomes artifacts.
      no_progress_cells_per_batch: 24  # Return to the outer criterion review after read-only churn.
      max_cells_per_batch: 48  # Bound one provider-owned tool loop without resetting its notebook.

    memory:
      enabled: true  # Shadow-capture the canonical trace alongside operational stores.
      implementation: trace_native  # Versioned programs over canonical evidence.
      ledger: jsonl  # Dependency-free append-only canonical backend.
      retrieval: lexical  # Live Lance prompt retrieval remains disabled.

    context:
      window_management: false  # Keep exact PTC history; bounded windows caused exploration churn.
      reconstruction: handoff_tail  # Keep recent exact interactions after the deterministic handoff.
      work_packet_tokens: 20000  # Total dynamic suffix budget per model call.
      max_task_input_tokens: 200000  # Cumulative task input budget.
      recent_event_limit: 12
      project_instruction_bytes: 16000
      skill_context_bytes: 24000
      max_selected_skills: 3
      ledger_tokens: 2000
      manifest_tokens: 800
      compaction_tokens: 3000
      recent_event_tokens: 3500
      conversation_tokens: 2000
      steering_tokens: 1000

    safety:  # Applies equally to direct tools, nested PTC calls, and verification.
      allow_dependency_install: false
      allow_network: false
      allow_git_history_mutation: false
      allow_unknown_commands: false
      redact_environment_names: []

    sandbox:  # PTC currently supports only the trusted-local adapter.
      kind: local
      memory_bytes: 4294967296
      max_processes: 256
      max_file_bytes: 1073741824

    steering:
      enabled: true
      lease_seconds: 900
      batch_limit: 4
      max_message_bytes: 4096
      safe_points: [before_model, before_tool, work_batch_boundary]

    adk:
      context_cache:
        min_tokens: 4096
        ttl_seconds: 1800
        cache_intervals: 10
      resumable: true

    tracing:
      mode: metadata  # Canonical ledger and SQLite traces remain redacted/metadata-only.
      max_content_bytes: 8192

    skills:
      project_root_enabled: true
      additional_roots: []

persistence:
  session_backend: sqlite
  artifact_backend: file

server:
  host: 127.0.0.1
  port: 8765
  websocket_path: /v1/agent
  protocol: ag_ui_websocket_v1
  max_connections: 32
  outbound_queue_size: 256
  first_event_timeout_seconds: 120
  idle_timeout_seconds: 180
  total_timeout_seconds: 1800
  first_event_retries: 1
  close_timeout_seconds: 15
